<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% include seo.html %}

<link rel="alternate" type="application/atom+xml" href="{{ site.atom_feed.path | default: '/feed.xml' | relative_url }}" title="{{ site.title }} Feed">
<link rel="sitemap" type="application/xml" title="Sitemap" href="{{ '/sitemap.xml' | relative_url }}">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbf9f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16140f" media="(prefers-color-scheme: dark)">

{%- comment -%} Must match the url() in _sass/_fonts.scss byte for byte, or the font loads twice. {%- endcomment %}
<link rel="preload" href="/assets/fonts/aab-text-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
