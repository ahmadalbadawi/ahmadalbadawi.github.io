<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/images/favicon.svg' | relative_url }}">
<link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}">
{%- if page.url == "/publications/" %}
<noscript><style>.pub-filter { display: none; }</style></noscript>
{%- endif %}

{% if page.mathjax %}
  {%- comment -%}
    MathJax stays on jsDelivr, as on the live site (owner's decision). inTabOrder: false keeps
    every formula out of the Tab order; the menu is still reachable from the context menu.
  {%- endcomment %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        processEscapes: true,
        tags: 'all'
      },
      options: { menuOptions: { settings: { inTabOrder: false } } },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
